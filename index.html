<!DOCTYPE html>
<html>
<head>
<title>Will You Be My Valentine?</title>
<style>
body {
    text-align: center;
    font-family: Arial;
    background-color: pink;
    overflow: hidden;
}

h1 {
    margin-top: 100px;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    margin: 10px;
    cursor: pointer;
}

#noBtn {
    position: absolute;
}

#message {
    font-size: 24px;
    color: red;
    margin-top: 20px;
}

#letter {
    display: none;
    margin: 20px;
    padding: 20px;
    background: white;
    border-radius: 10px;
}

#surpriseImg {
    display: none;
    margin-top: 20px;
    width: 250px;
}
</style>
</head>

<body>

<h1 id="question">Will you be my Valentine? ❤️</h1>

<img id="sadImage" width="200">

<br>

<button onclick="yesClicked()">Yes 💖</button>
<button id="noBtn" onclick="noClicked()">No 😢</button>

<div id="message"></div>

<div id="letter">
<h2 style="color:red;">I Love You ❤️</h2>

<p>
प्रिय Unisha,<br><br>
तिमी मेरो जीवनको सबैभन्दा सुन्दर उपहार हौ।  
तिम्रो मुस्कानले मेरो दिन उज्यालो बनाउँछ।  
म सधैं तिमीलाई माया गर्नेछु। 💖<br><br>

सधैं तिम्रो,<br>
Vivek
</p>

<button onclick="showSurprise()">Open for Surprise 🎁</button>
<br><br>
<img id="surpriseImg" src="your-photo.jpg">
</div>

<script>
let noCount = 0;

let sadMessages = [
"Are you sure? 😭",
"Please don’t do this 💔",
"I will be very sad 😢",
"Think again 🥺",
"Don’t break my heart 💔",
"Last chance 😭",
"Really sure? 🥺",
"I’m crying 😭",
"Please say yes 💖",
"Okay… this hurts 💔"
];

function noClicked() {
    if(noCount < 9){
        let x = Math.random() * window.innerWidth;
        let y = Math.random() * window.innerHeight;
        document.getElementById("noBtn").style.left = x + "px";
        document.getElementById("noBtn").style.top = y + "px";

        document.getElementById("message").innerHTML = sadMessages[noCount];
        noCount++;
    } else {
        document.getElementById("noBtn").style.display = "none";
        document.getElementById("message").innerHTML = "Only Yes is left ❤️";
    }
}

function yesClicked(){
    document.body.style.backgroundColor = "white";
    document.getElementById("question").style.display = "none";
    document.getElementById("noBtn").style.display = "none";
    document.getElementById("message").innerHTML = "";

    let flash = document.createElement("h1");
    flash.innerHTML = "I LOVE YOU ❤️";
    flash.style.color = "red";
    document.body.appendChild(flash);

    setTimeout(function(){
        flash.remove();
        document.getElementById("letter").style.display = "block";
    },3000);
}

function showSurprise(){
    document.getElementById("surpriseImg").style.display = "block";
}
</script>

</body>
</html>
